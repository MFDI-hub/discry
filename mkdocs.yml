site_name: "discry"
site_description: "Scrape Discord web client bootstrap values"
# Canonical URL for the sitemap. docs.yml publishes a GitHub Pages project site.
# For Read the Docs, use https://discry.readthedocs.io/ instead.
site_url: https://MFDI-hub.github.io/discry/

repo_url: https://github.com/MFDI-hub/discry
repo_name: MFDI-hub/discry
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - search.suggest

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  # Pulls docstrings straight out of the package. Use it in a page with:
  #   ::: discry
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # RTD never installs the project. This lets mkdocstrings import it from src/.
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            docstring_style: google
            separate_signature: true
            merge_init_into_class: true
            show_if_no_docstring: false
            signature_crossrefs: true
  # One page per module, filled from the docstrings. Replaces a hand-written api.md.
  - api-autonav:
      modules: ["src/discry"]
      nav_section_title: "API Reference"
      api_root_uri: reference
      exclude_private: true
      show_full_namespace: false

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Development: development.md
  - Publishing: publishing.md
