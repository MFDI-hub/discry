# ---- Project info ----
# https://packaging.python.org/en/latest/specifications/pyproject-toml/

# Standard project metadata. [project] must come first: TOML tables cannot be
# reopened later in the file.
[project]
name = "discry"
description = "Scrape Discord web client bootstrap values"
authors = [
    { name = "mfdi", email = "mfdisanchez@gmail.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Version comes from git tags at build time (see [tool.uv-dynamic-versioning]).
dynamic = ["version"]

# https://pypi.org/classifiers/ — adjust as needed:
classifiers = [
    "Development Status :: 4 - Beta",
    # "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
    # Uncomment to make PyPI refuse a publish by accident:
    # "Private :: Do Not Upload",
]

dependencies = [
    # Floors are the releases that fix the HIGH advisories CI scans for.
    # Both current lines require Python 3.10 or newer.
    "curl-cffi>=0.15.0",
    "orjson>=3.11.6",
    # zoneinfo has no IANA database on Windows without this package.
    "tzdata>=2024.1",
    # tomllib is in the standard library from 3.11. Python 3.10 uses tomli.
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Extras are optional *runtime* features your users opt into, e.g.
#   pip install discry[fast]
# Start empty. deptry reports extras that nothing imports as unused (DEP002),
# so only add one when the code actually uses it behind a guarded import.
# fast = ["orjson>=3.10"]

[project.urls]
Repository = "https://github.com/MFDI-hub/discry"
# docs.yml publishes a GitHub Pages project site at this URL.
Documentation = "https://MFDI-hub.github.io/discry/"
# Homepage = "https://..."

[project.scripts]
# Prefer the module name (snake_case); hyphens in a console script name can
# break the generated .exe shim on Windows.
discry = "discry.cli:main"


# ---- Dependency groups (PEP 735) ----
# Installed by "uv sync" (dev is the default group) and by
# "uv run <tool>" when the tool is missing. Extras are installed with
# "uv sync --all-extras".

[dependency-groups]
# Dev tools stay on Python 3.11+. The package itself installs on 3.10+.
dev = [
    # ty checks the package as Python 3.10, where config files use tomli.
    # The runtime marker above does not install it into a 3.11+ environment.
    "tomli>=2.0.1",
    # Lint, format, type check.
    "ruff>=0.17.3; python_version >= '3.11'",
    "ty>=0.0.96; python_version >= '3.11'",
    "codespell>=2.4.3; python_version >= '3.11'",
    "vulture>=2.16; python_version >= '3.11'",
    "deptry>=0.25.1; python_version >= '3.11'",
    # Test runner + the plugins most projects end up needing.
    "pytest>=9.2.0; python_version >= '3.11'",
    "pytest-cov>=7.1.0; python_version >= '3.11'",
    "pytest-xdist>=3.8.0; python_version >= '3.11'",
    "pytest-sugar>=1.1.1; python_version >= '3.11'",
    "pytest-timeout>=2.4.0; python_version >= '3.11'",
    "pytest-asyncio>=1.4.1; python_version >= '3.11'",
    "pytest-mock>=3.17.0; python_version >= '3.11'",
    # Shuffles test order on every pytest run. The seed is in the pytest header
    # once verbosity is high enough to show it (`make test-random` uses -vv).
    "pytest-randomly>=5.1.0; python_version >= '3.11'",
    # Git hooks, commits, releases.
    "pre-commit>=4.7.0; python_version >= '3.11'",
    "commitizen>=4.19.3; python_version >= '3.11'",
    "rich>=15.0.0; python_version >= '3.11'",
    "funlog>=0.2.1; python_version >= '3.11'",
    # CLI tools from https://github.com/MFDI-hub/tool-shed. PyPI name is
    # tools-shed; Warehouse rejects tool-shed.
    "tools-shed>=0.2.1; python_version >= '3.11'",
]

# Documentation. Split out so `--no-group docs` keeps syncs small.
docs = [
    "mkdocs>=1.6.1; python_version >= '3.11'",
    "mkdocs-material>=9.8.0; python_version >= '3.11'",
    "mkdocs-git-revision-date-localized-plugin>=1.6.3; python_version >= '3.11'",
    "mkdocstrings[python]>=1.0.8; python_version >= '3.11'",
    "mkdocs-api-autonav>=0.4.0; python_version >= '3.11'",
]

# Optional test group for property-based tests: `uv sync --group hypothesis`.
property-testing = [
    "hypothesis>=6.170.14; python_version >= '3.11'",
]

# Profiling helpers: `uv sync --group profiling`.
profiling = [
    "py-spy>=0.4.3; python_version >= '3.11'",
    "snakeviz>=2.2.2; python_version >= '3.11'",
]

# ---- uv ----
# Without this, splitting docs out of `dev` would silently stop `uv sync` from
# installing MkDocs, and every `uv run mkdocs ...` would fail.

[tool.uv]
default-groups = ["dev", "docs"]
# The version is dynamic (git tags). uv's default cache key is pyproject.toml
# only, so an editable install can keep reporting the pre-tag version.
# Setting cache-keys replaces the default, so pyproject.toml stays in the list.
# https://docs.astral.sh/uv/concepts/cache/#dynamic-metadata
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# ---- Build system ----
# hatchling builds the sdist and wheel. uv-dynamic-versioning reads the version
# from git tags at build time. Pin each requirement on its own.
# https://github.com/ninoseki/uv-dynamic-versioning/

[build-system]
requires = ["hatchling>=1.33.0", "uv-dynamic-versioning[hatch]>=0.14.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"
# JSON schemas for tool.hatch.version.source are incomplete, so IDEs may warn:
# https://github.com/ninoseki/uv-dynamic-versioning/issues/21

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
# Release commits/tags are created by semantic-release (.releaserc.yml).
bump = false
# Builds outside a git checkout (Dependabot's uv updater, some sandboxes)
# raise RuntimeError without this. 0.0.0 is the plugin's documented fallback.
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/discry"]


# ---- Ruff (lint + format) ----
# https://docs.astral.sh/ruff/configuration/

[tool.ruff]
# Typically 88 (black standard) or 100 (wide).
line-length = 100
# Oldest Python in requires-python: lets ruff modernise code for it (UP rules).
target-version = "py310"
# Also lint docstring code blocks and notebooks once you have them:
# extend-include = ["*.ipynb"]

[tool.ruff.lint]
# Curated rule set from the Ruff docs, plus a few high-value families.
# Full catalogue: https://docs.astral.sh/ruff/rules/
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort (import sorting)
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "ARG",     # flake8-unused-arguments
    "TC",      # flake8-type-checking (move type-only imports behind TYPE_CHECKING)
    "PTH",     # flake8-use-pathlib
    "ERA",     # eradicate (commented-out code)
    "PGH",     # pygrep-hooks (no blanket "# type: ignore" / "# noqa")
    "RUF",     # ruff-specific
    "S",       # flake8-bandit (security) — remove if it gets in the way
    # "D",     # pydocstyle (docstrings) — enable once you write docstrings
    # "N",     # pep8-naming
    # "ANN",   # flake8-annotations (needs ty's ruff-era typing discipline)
    # "PT",    # flake8-pytest-style
    # "TRY",   # tryceratops
]
ignore = [
    # Disabled on purpose (add/remove as desired):
    "E501",    # https://docs.astral.sh/ruff/rules/line-too-long/ — the formatter owns line length
    "E402",    # module-import-not-at-top-of-file — needed for sys.path/uv scripts
    "E731",    # lambda-assignment — handy for short callbacks
    # Always disable these when using ruff format + ruff check together:
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191", "E111", "E114", "E117",
    "D206", "D300",
    "Q000", "Q001", "Q002", "Q003",
    "COM812", "COM819",
    "ISC001", "ISC002",
]

[tool.ruff.lint.per-file-ignores]
# Tests often need "unused" fixture arguments and assert inside helpers.
"tests/**" = ["ARG001", "ARG002", "S101", "B018", "S105", "S106"]
# T201: scripts are thin wrappers that legitimately print.
# S603/S607: they also legitimately shell out to tools like git.
"scripts/**" = ["T201", "S603", "S607"]
"devtools/**" = ["S603", "S607"]
# An __init__.py re-exporting a public API looks like unused imports.
"src/**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["discry"]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true


# ---- ty (type checking) ----
# https://docs.astral.sh/ty/configuration/

[tool.ty.environment]
# Keep in sync with requires-python above; ty would otherwise infer it, but
# being explicit keeps editors and CI on the same target.
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests", "devtools", "scripts"]

[tool.ty.rules]
# ty is pre-1.0 and some rules are noisy; demote here instead of ignoring whole
# files. `uv run ty check --output-format concise` lists every diagnostic code.
unused-ignore-comment = "warn"

# Unresolved third-party imports are an environment problem, not a code problem.
# If a dependency ships no stubs or py.typed marker, allow it explicitly:
# [tool.ty.analysis]
# allowed-unresolved-imports = ["untyped_package.**"]

# ---- codespell ----
# https://github.com/codespell-project/codespell

[tool.codespell]
skip = "*.lock,uv.lock,.git,dist,site,htmlcov,outputs"
ignore-words-list = "scrapper"


# ---- pytest ----
# https://docs.pytest.org/en/stable/reference/reference.html#configuration-options

[tool.pytest.ini_options]
minversion = "8.0"
# Default discovery. ["*.py"] would import helpers, fixtures, and data scripts
# under tests/ and can collect the same module twice.
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
# No pythonpath. `uv sync` installs the project, so tests import the package a
# user gets. pythonpath = ["src"] would let tests pass against a broken wheel.
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    # Fail a hung test instead of hanging CI forever.
    "--timeout=60",
]
# Useful defaults for async projects; harmless if you never write `async def`.
asyncio_mode = "auto"
# Both must be explicit once asyncio_mode is set, or pytest-asyncio warns.
asyncio_default_fixture_loop_scope = "function"
# Treat warnings as errors so deprecations get fixed, but let plugin authors'
# own warnings through: "error" turns a third-party deprecation into a crash.
filterwarnings = [
    "error",
    "default::DeprecationWarning:pytest_asyncio.*",
    "default::pytest.PytestDeprecationWarning:pytest_asyncio.*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: touches the network, disk, or another process",
]


# ---- coverage ----
# https://coverage.readthedocs.io/en/stable/config.html

[tool.coverage.run]
branch = true
source = ["src"]
relative_files = true

[tool.coverage.paths]
# Merge coverage produced in different places (local, CI, containers).
source = [
    "src/",
    "*/site-packages/",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Start strict so coverage cannot quietly rot; lower it while bootstrapping.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def __repr__",
    "@(typing\\.)?overload",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

# ---- deptry (dependency hygiene: unused, missing, misplaced) ----
# https://deptry.com/usage/

[tool.deptry]
# Directories scanned for imports.
extend_exclude = ["devtools", "docs"]

# CLI tools, pytest plugins, and the docs/profiling extras are never imported.
# devtools/ (where rich and funlog are imported) is excluded above, so those
# two look unused as well. tools-shed is only invoked as console scripts.
# Without this list, `deptry .` fails on a brand-new project.
[tool.deptry.per_rule_ignores]
DEP002 = [
    # zoneinfo loads the IANA database from this package. Nothing imports it.
    "tzdata",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-sugar",
    "pytest-timeout",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-randomly",
    "pre-commit",
    "commitizen",
    "ruff",
    "ty",
    "codespell",
    "vulture",
    "deptry",
    "rich",
    "funlog",
    "mkdocs",
    "mkdocs-material",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocstrings",
    "mkdocs-api-autonav",
    "hypothesis",
    "py-spy",
    "snakeviz",
    "tools-shed",
]

[tool.deptry.package_module_name_map]
# Mapping a package to its import name also silences "Assuming the corresponding
# module name of package ..." notices.
mkdocs-material = "material"
mkdocs-git-revision-date-localized-plugin = "mkdocs_git_revision_date_localized_plugin"
mkdocs-api-autonav = "mkdocs_api_autonav"
uv-dynamic-versioning = "uv_dynamic_versioning"
py-spy = "py_spy"
hypothesis = "hypothesis"
snakeviz = "snakeviz"
tools-shed = "tools_shed"


# ---- Commitizen (Conventional Commits helper) ----
# https://commitizen-tools.github.io/commitizen/config/

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "scm"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"


# ---- vulture (dead code) ----

[tool.vulture]
min_confidence = 80
paths = ["src", "tests", "devtools", "scripts"]
ignore_names = ["main"]
# exclude = ["*/migrations/*"]