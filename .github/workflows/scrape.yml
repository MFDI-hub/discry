name: Scrape Discord client

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-discord-client
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: "3.13"

      # Default groups are dev and docs. Installing them here makes `uv run`
      # download them again during the scrape step.
      - name: Install dependencies
        run: uv sync --locked --no-default-groups

      - name: Scrape Discord client surface
        id: scrape
        env:
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
          SCRAPER_IMPERSONATE: ${{ vars.SCRAPER_IMPERSONATE }}
          SCRAPER_LATEST_FORMATS: json,md,csv,toml,yaml
          SCRAPER_CHANNEL_CONCURRENCY: "3"
        run: uv run --no-sync discry

      # protect-main requires a pull request. The GitHub Actions app cannot be
      # added as a bypass actor on a personal repository, so this job pushes
      # scrape/data and merges that pull request.
      - name: Commit updated data
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B scrape/data
          git add data/latest.json data/latest.md data/latest.csv data/latest.toml data/latest.yaml data/history.json
          if [ -d data/client ]; then
            git add -A -- data/client
          fi
          # A log near 100 MB is renamed history-YYYY-MM-DDTHH-MM-SSZ.json.
          # The open file stays data/history.json.
          shopt -s nullglob
          archives=(data/history-*.json data/history-*.md data/history-*.csv data/history-*.toml data/history-*.yaml)
          if ((${#archives[@]})); then
            git add -- "${archives[@]}"
          fi
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore: update Discord client surface [skip ci]"
          git push --force -u origin HEAD
          # Create is the common path: the previous merge deletes scrape/data.
          # View only when that branch already has an open pull request.
          if ! gh pr create --base main --head scrape/data \
            --title "Update Discord client surface" \
            --body "Hourly scrape of the public web client." \
            2>pr-create.err; then
            if ! gh pr view scrape/data --json url --jq .url >/dev/null; then
              cat pr-create.err >&2
              exit 1
            fi
          fi
          gh pr merge scrape/data --merge --delete-branch \
            --subject "chore: update Discord client surface [skip ci]" \
            --body "Hourly scrape of the public web client."

      - name: Close scraper-failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          numbers="$(gh issue list --label scraper-failure --state open --json number --jq '.[].number')"
          if [ -z "${numbers}" ]; then
            exit 0
          fi
          while IFS= read -r number; do
            gh issue comment "${number}" --body "$(printf '%s\n\n%s' \
              "Scraper succeeded again. Closing this issue." \
              "[Workflow run](${run_url})")"
            gh issue close "${number}"
          done <<< "${numbers}"

      - name: Open or update scraper-failure issue
        if: failure() && steps.scrape.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          label_err="$(mktemp)"
          if ! gh label create scraper-failure --color B60205 \
            --description "Discord client scraper could not read the app page" \
            2>"${label_err}"; then
            if ! grep -qi "already exists" "${label_err}"; then
              cat "${label_err}" >&2
              exit 1
            fi
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(printf '%s\n\n%s' \
            "The Discord client scraper failed (network error or unreadable app page)." \
            "[Workflow run](${run_url})")"
          number="$(gh issue list --label scraper-failure --state open --json number --jq '.[0].number // empty')"
          if [ -z "${number}" ]; then
            gh issue create --title "Scraper failed to read the Discord client" \
              --label scraper-failure --body "${body}"
          else
            again="$(printf '%s\n\n%s' \
              "The scraper failed again." \
              "[Workflow run](${run_url})")"
            gh issue comment "${number}" --body "${again}"
          fi
