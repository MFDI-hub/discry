name: Scrape Discord client

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-discord-client
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Scrape Discord client surface
        id: scrape
        env:
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
          SCRAPER_IMPERSONATE: ${{ vars.SCRAPER_IMPERSONATE }}
          SCRAPER_LATEST_FORMATS: json,md,csv,toml,yaml
        run: uv run discry

      - name: Commit updated data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/latest.md data/latest.csv data/latest.toml data/latest.yaml data/history.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update Discord client surface [skip ci]"
            git push
          fi

      - name: Close scraper-failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "scraper-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Scraper succeeded again. Closing this issue.\n\n[Workflow run](${runUrl})`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Open or update scraper-failure issue
        if: failure() && steps.scrape.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "scraper-failure";
            const title = "Scraper failed to read the Discord client";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The Discord client scraper failed (network error or unreadable app page).\n\n[Workflow run](${runUrl})`;

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "B60205",
                description: "Discord client scraper could not read the app page",
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `The scraper failed again.\n\n[Workflow run](${runUrl})`,
              });
            }
