# Discord client surface scraper.
# Priority: CLI flags > environment variables > this file > defaults.

# curl_cffi browser profile. Aliases such as chrome, edge, safari, firefox.
impersonate = "chrome"

# Optional proxy URL, for example "socks5://user:pass@host:port".
# proxy = ""

timeout = 30
verify = true
channels = ["stable", "ptb", "canary"]
data_dir = "data"
max_files = 40
download_concurrency = 8

# Leave unset to download /assets/ from the channel host
# (discord.com, ptb.discord.com, canary.discord.com).
# asset_base_url = "https://discord.com"

